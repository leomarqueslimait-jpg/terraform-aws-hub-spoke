name: spoke-dev

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/spoke-dev/**"
      - "modules/vpc/**"
      - ".github/workflows/spoke-dev.yml"
      - ".github/workflows/_terraform-reusable.yml"
  push:
    branches: [main]
    paths:
      - "envs/spoke-dev/**"
      - "modules/vpc/**"
      - ".github/workflows/spoke-dev.yml"
      - ".github/workflows/_terraform-reusable.yml"

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    permissions:
      id-token: write # required for OIDC
      contents: read
      pull-requests: write # required to post the plan as a PR comment
    with:
      environment: spoke-dev
      working_directory: envs/spoke-dev
      role_arn: ${{ vars.SPOKE_DEV_DEPLOY_ROLE_ARN }}
    # SPOKE_DEV_DEPLOY_ROLE_ARN comes from bootstrap's
    # `deploy_role_arns["spoke-dev"]` output. Set it under Settings >
    # Secrets and variables > Actions > Variables.
