name: spoke-prod

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/spoke-prod/**"
      - "modules/vpc/**"
      - ".github/workflows/spoke-prod.yml"
      - ".github/workflows/_terraform-reusable.yml"
  push:
    branches: [main]
    paths:
      - "envs/spoke-prod/**"
      - "modules/vpc/**"
      - ".github/workflows/spoke-prod.yml"
      - ".github/workflows/_terraform-reusable.yml"

jobs:
  terraform:
    uses: ./.github/workflows/_terraform-reusable.yml
    permissions:
      id-token: write # required for OIDC
      contents: read
      pull-requests: write # required to post the plan as a PR comment
    with:
      environment: spoke-prod
      working_directory: envs/spoke-prod
    secrets:
      role_arn: ${{ secrets.SPOKE_PROD_DEPLOY_ROLE_ARN }}
    # SPOKE_PROD_DEPLOY_ROLE_ARN comes from bootstrap's
    # `deploy_role_arns["spoke-prod"]` output. Set it under Settings >
    # Secrets and variables > Actions > Secrets.