# Reusable Terraform plan/apply workflow, called once per environment by
# hub.yml, spoke-dev.yml, and spoke-prod.yml. Keeping the actual
# init/plan/apply steps in one place means fixing a bug or changing the
# Terraform version only has to happen here, not in three separate files.
#
# Plan runs on pull_request and posts the plan output as a PR comment.
# Apply runs on push to main, but only after this job's GitHub Environment
# (passed in as `environment`) has a required reviewer approve it — that's
# what actually enforces "manual approval before apply," not anything in
# this file itself. See Settings > Environments in the repo to configure
# the reviewer on each of the three environments.

name: Terraform Plan/Apply

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment name — also the GitHub Environment used to gate apply (hub, spoke-dev, spoke-prod)"
        required: true
        type: string
      working_directory:
        description: "Path to the environment's Terraform config, e.g. envs/hub"
        required: true
        type: string
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      terraform_version:
        description: "Terraform version to install"
        required: false
        type: string
        default: "1.15.8"
    secrets:
      role_arn:
        description: "IAM role ARN this workflow assumes via OIDC (from bootstrap's deploy_role_arns output)"
        required: true

permissions:
  id-token: write # required to request the OIDC token
  contents: read
  pull-requests: write # required to post the plan as a PR comment

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-${{ inputs.environment }}-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Read plan output
        id: read_plan
        run: |
          {
            echo 'plan<<EOF'
            cat plan_output.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan — \`${{ inputs.environment }}\`
            <details><summary>Show plan</summary>

            \`\`\`
            ${{ steps.read_plan.outputs.plan }}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # <- manual approval gate lives here
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-${{ inputs.environment }}-apply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan